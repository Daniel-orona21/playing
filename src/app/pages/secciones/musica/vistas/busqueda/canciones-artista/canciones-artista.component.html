<div class="artista-container">
    <div class="header">
        <div class="artista-imagen" *ngIf="artist">
            <img *ngIf="artist.imagen_url" [src]="artist.imagen_url" [alt]="artist.nombre">
            <i *ngIf="!artist.imagen_url" class="fa-solid fa-user"></i>
        </div>
        <div class="contenedor">
            <div class="izq">
            <button class="back-button" (click)="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
            <h2>{{ artist?.nombre }}</h2>
        </div>
        <div *ngIf="!loading" class="acciones">
            <button (click)="toggleBloqueo()" [class.bloqueado]="bloqueado">
                <span class="material-symbols-outlined">
                    block
                </span>
                <!-- <p>{{ bloqueado ? 'Desbloquear artista' : 'Bloquear artista' }}</p> -->
            </button>
            <button class="reproducirArtista"
                    [disabled]="loading || !songs.length"
                    (click)="abrirModalReproduccionArtista()">
                <span class="material-symbols-outlined">
                    play_arrow
                </span>
            </button>
        </div>
        </div>
    </div>

    <div class="songs-grid">
         <div *ngIf="loading" class="loading">
            <svg class="loader" viewBox="0 0 384 384" xmlns="http://www.w3.org/2000/svg">
            <circle
                class="active"
                pathLength="360"
                fill="transparent"
                stroke-width="32"
                cx="192"
                cy="192"
                r="176"
            ></circle>
            <circle
                class="track"
                pathLength="360"
                fill="transparent"
                stroke-width="32"
                cx="192"
                cy="192"
                r="176"
            ></circle>
            </svg>

            <p>Cargando canciones...</p>
        </div>
        
        <div class="cancion" 
             *ngFor="let song of songs; let i = index" 
             [class.menu-abierto]="menuAbierto === i" 
             [class.bloqueada]="isCancionBlocked(song.spotify_id)"
             (click)="reproducirCancion(song, $event)"
             (contextmenu)="abrirMenuContextual(i, $event)">
            <div class="portada">
                <img *ngIf="song.imagen_url" [src]="song.imagen_url" [alt]="song.titulo">
                <i *ngIf="!song.imagen_url" class="fa-solid fa-music"></i>
                <div *ngIf="isCancionBlocked(song.spotify_id)" class="blocked-overlay">
                    <span class="material-symbols-outlined">block</span>
                </div>
            </div>
            <div class="infoCancion">
                <p class="nombreCancion">{{song.titulo}}</p>
                <p class="artista">{{song.artista}}</p>
            </div>
            <button class="mas" (click)="abrirMenu(i, $event)"><i class="fa-solid fa-ellipsis"></i></button>
            <div 
                *ngIf="menuAbierto === i || menuCerrando === i" 
                class="menu-flotante"
                [class.cerrando]="menuCerrando === i"
                [style.top.px]="menuPosition.top"
                [style.left.px]="menuPosition.left"
                (click)="$event.stopPropagation()">
                <button 
                    class="opcion"
                    [disabled]="isCancionBlocked(song.spotify_id)"
                    (click)="agregarALaCola(song, true); cerrarMenu(i)">
                    <span class="material-symbols-outlined">
                        playlist_play
                        </span>
                    <span class="textoBoton">Agregar a la fila</span>
                </button>
                <div class="linea"></div>
                <button 
                    class="opcion"
                    [disabled]="isCancionBlocked(song.spotify_id)"
                    (click)="agregarSiguiente(song, true)">
                    <span class="material-symbols-outlined">
                        skip_next
                        </span>
                    <span class="textoBoton">Reproducir siguiente</span>
                </button>
                <div class="linea"></div>
                <button 
                    class="opcion"
                    [class.eliminar]="!isCancionBlocked(song.spotify_id)"
                    [disabled]="isCancionBlocked(song.spotify_id)"
                    (click)="bloquearCancion(song)">
                    <span class="material-symbols-outlined">
                        block
                        </span>
                    <span class="textoBoton">{{ isCancionBlocked(song.spotify_id) ? 'Canción bloqueada' : 'Bloquear canción' }}</span>
                </button>
            </div>
        </div>
    </div>
</div>

<div class="modal-backdrop" *ngIf="mostrarModalArtista" (click)="cerrarModalReproduccionArtista()">
    <div class="modal-contenido" (click)="$event.stopPropagation()">
        <button class="cerrar" (click)="cerrarModalReproduccionArtista()">
        </button>
        <div class="modal-header">
            <div>
                <h3>Reproducir {{ artist?.nombre }}?</h3>
            </div>
        </div>
        <div class="modal-body">
            <ul>
                <li>
                    <p>Se reemplazará la fila actual por {{ songs.length }} canciones de {{ artist?.nombre }} en orden aleatorio.</p>
            </ul>
            <p *ngIf="errorReproduccionArtista" class="error">
                {{ errorReproduccionArtista }}
            </p>

            <label class="omit-confirm">
                <input 
                    type="checkbox" 
                    id="cbx2"
                    [checked]="omitirConfirmacionArtista"
                    (change)="onChangeOmitirConfirmacionArtista($event.target.checked)"
                    style="display: none;"
                >

                <label for="cbx2" class="check">
                    <svg width="18px" height="18px" viewBox="0 0 18 18">
                        <path d="M 1 9 L 1 9 c 0 -5 3 -8 8 -8 L 9 1 C 14 1 17 5 17 9 L 17 9 c 0 4 -4 8 -8 8 L 9 17 C 5 17 1 14 1 9 L 1 9 Z"></path>
                        <polyline points="1 9 7 14 15 4"></polyline>
                    </svg>
                </label>

                <span>No volver a mostrar</span>
            </label>
        </div>
        <div class="modal-footer">
            <button class="btn cancelar" (click)="cerrarModalReproduccionArtista()" [disabled]="procesandoReproduccionArtista">
                Cancelar
            </button>
            <button class="btn confirmar"
                    (click)="confirmarReproduccionArtista()">
                <span *ngIf="procesandoReproduccionArtista" class="spinner"></span>
                <span>{{ procesandoReproduccionArtista ? 'Preparando...' : 'Confirmar' }}</span>
            </button>
        </div>
    </div>
</div>
