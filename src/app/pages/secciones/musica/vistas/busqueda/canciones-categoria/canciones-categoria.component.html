<div class="categoria-container">
    <div 
        class="menu-overlay"
        *ngIf="isMenuOverlayVisible()"
        (click)="handleMenuOverlayInteraction($event)"
        (contextmenu)="handleMenuOverlayInteraction($event)">
    </div>
    <div class="header">
        <div class="izq">
            <button class="back-button" (click)="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
            <h2>{{ categoryName }}</h2>
        </div>
        <div *ngIf="!loading" class="botones" [class.visible]="buttonsVisible">
            <button (click)="toggleBloqueo()" [class.bloqueado]="bloqueado">
            <span class="material-symbols-outlined">
                block
            </span>
            <p>{{ bloqueado ? 'Desbloquear género' : 'Bloquear género' }}</p>
        </button>
        <button class="reproducirGenero"
                [disabled]="loading || !songs.length"
                (click)="abrirModalReproduccionGenero()">
            <span class="material-symbols-outlined">
                play_arrow
            </span>
            <p>Reproducir</p>
        </button>
        </div>
    </div>

    <div class="songs-grid">
         <div *ngIf="loading" class="loading">
            <!-- From Uiverse.io by SelfMadeSystem --> 
            <svg class="loader" viewBox="0 0 384 384" xmlns="http://www.w3.org/2000/svg">
            <circle
                class="active"
                pathLength="360"
                fill="transparent"
                stroke-width="32"
                cx="192"
                cy="192"
                r="176"
            ></circle>
            <circle
                class="track"
                pathLength="360"
                fill="transparent"
                stroke-width="32"
                cx="192"
                cy="192"
                r="176"
            ></circle>
            </svg>

            <p>Cargando canciones...</p>
        </div>
        
        <div class="cancion" 
             *ngFor="let song of songs; let i = index" 
             [class.menu-abierto]="menuAbierto === i" 
             [class.bloqueada]="isCancionBlocked(song.spotify_id)"
             [class.visible]="isSongVisible(i)"
             (click)="reproducirCancion(song, $event)"
             (contextmenu)="abrirMenuContextual(i, $event)">
            <div class="portada">
                <img *ngIf="song.imagen_url" [src]="song.imagen_url" [alt]="song.titulo">
                <i *ngIf="!song.imagen_url" class="fa-solid fa-music"></i>
                <div *ngIf="isCancionBlocked(song.spotify_id)" class="blocked-overlay">
                    <span class="material-symbols-outlined">block</span>
                </div>
            </div>
            <div class="infoCancion">
                <p class="nombreCancion">{{song.titulo}}</p>
                <p class="artista">{{song.artista}}</p>
            </div>
            <button class="mas" (click)="abrirMenu(i, $event)"><i class="fa-solid fa-ellipsis"></i></button>
            <div 
                *ngIf="menuAbierto === i || menuCerrando === i" 
                class="menu-flotante"
                [class.cerrando]="menuCerrando === i"
                [style.top.px]="menuPosition.top"
                [style.left.px]="menuPosition.left"
                (click)="$event.stopPropagation()">
                <button 
                    class="opcion"
                    [disabled]="isCancionBlocked(song.spotify_id)"
                    (click)="agregarSiguiente(song, true)">
                    <span class="material-symbols-outlined">
                        skip_next
                        </span>
                    <span class="textoBoton">Reproducir siguiente</span>
                </button>
                <button 
                    class="opcion"
                    [disabled]="isCancionBlocked(song.spotify_id)"
                    (click)="agregarALaCola(song, true); cerrarMenu(i)">
                    <span class="material-symbols-outlined">
                        playlist_play
                        </span>
                    <span class="textoBoton">Agregar a la fila</span>
                </button>
                <div class="linea"></div>
                <button 
                    class="opcion"
                    [class.eliminar]="!isCancionBlocked(song.spotify_id)"
                    [disabled]="isCancionBlocked(song.spotify_id)"
                    (click)="bloquearCancion(song)">
                    <span class="material-symbols-outlined">
                        block
                        </span>
                    <span class="textoBoton">{{ isCancionBlocked(song.spotify_id) ? 'Canción bloqueada' : 'Bloquear canción' }}</span>
                </button>
            </div>
        </div>
    </div>
</div>

<div class="modal-backdrop" *ngIf="mostrarModalGenero" (click)="cerrarModalGenero()">
    <div class="modal-contenido" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <!-- <span class="material-symbols-outlined play">playlist_add</span> -->
            <div>
                <h3>Reproducir {{ categoryName }}?</h3>
            </div>
        </div>
        <div class="modal-body">
            <ul>
                <li>
                    <p>Se reemplazará la fila actual por {{ songs.length }} canciones de {{ categoryName }} en orden aleatorio.</p>
                </li>
            </ul>
            <p *ngIf="errorReproduccionGenero" class="error">
                {{ errorReproduccionGenero }}
            </p>
            <label class="omit-confirm">
                <input 
                    type="checkbox" 
                    id="cbx2"
                    [checked]="omitirConfirmacionGenero"
                    (change)="onChangeOmitirConfirmacionGenero($event.target.checked)"
                    style="display: none;"
                >

                <label for="cbx2" class="check">
                    <svg width="18px" height="18px" viewBox="0 0 18 18">
                        <path d="M 1 9 L 1 9 c 0 -5 3 -8 8 -8 L 9 1 C 14 1 17 5 17 9 L 17 9 c 0 4 -4 8 -8 8 L 9 17 C 5 17 1 14 1 9 L 1 9 Z"></path>
                        <polyline points="1 9 7 14 15 4"></polyline>
                    </svg>
                </label>

                <span>No volver a mostrar</span>
            </label>
        </div>
        <div class="modal-footer">
            <button class="btn cancelar" (click)="cerrarModalGenero()" [disabled]="procesandoReproduccionGenero">
                Cancelar
            </button>
            <button class="btn confirmar"
                    (click)="confirmarReproduccionGenero()">
                <span *ngIf="!procesandoReproduccionGenero">Confirmar</span>
                <span *ngIf="procesandoReproduccionGenero">Preparando...</span>
            </button>
        </div>
    </div>
</div>
